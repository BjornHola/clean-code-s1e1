<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page">
    <div class="introduce-block">
      <img 
        class="introduce-block__picture"
        src="./eisenhower-matrix.jpg">
      <a 
        class="more-info"
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details&quest;
      </a>
    </div>
    <div class="main-page-element">
      <p id="add-to-list">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input 
            id="new-task" 
            class="task" 
            type="text">
          <button class="task-row-wrapper__button">Add</button>
        </div>
      </p>
      <h3 class="main-page-element__headline">Todo</h3>
      <ul id="incompleteTasks" class="task-list">
        <li class="task-list__item">
          <input type="checkbox" id="input-incompleteTasks" class="task__checkbox">
          <label class="task">Pay Bills</label>
          <input 
            type="text" 
            class="task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img 
              src="./remove.svg" 
              class="delete__icon">
          </button>
        </li>
        <li class="task-list__item editMode">
          <input type="checkbox" class="task__checkbox">
          <label class="task">Go Shopping</label>
          <input 
            type="text" 
            value="Go Shopping" 
            class="task task__input-text">
          <button class="edit">Save</button>
          <button class="delete">
            <img 
              src="./remove.svg"
              class="delete__icon">
          </button>
        </li>
      </ul>
      <h3 class="main-page-element__headline">Completed</h3>
      <ul id="completed-tasks" class="task-list task-list_completed">
        <li class="task-list__item">
          <input 
            type="checkbox" class="task__checkbox" id="input-completed-tasks" checked>
          <label class="task">See the Doctor</label>
          <input 
            type="text" 
            class="task task__input-text">
          <button class="edit">Edit</button>
          <button class="delete">
            <img 
              src="./remove.svg" class="delete__icon">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
